services:
  - type: web
    name: police-bot-discord
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DISCORD_TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: GUILD_ID
        sync: false
      - key: CITIZEN_ROLE_ID
        sync: false
      - key: POLICE_ROLE_ID
        sync: false
      - key: ACADEMY_ROLE_ID
        sync: false
      - key: ACCEPTED_CV_ROLE_ID
        sync: false
      - key: RECRUITMENT_ROLE_ID
        sync: false
      - key: BLACKLIST_CHANNEL_ID
        sync: false
      - key: ACCEPTANCE_LOG_CHANNEL_ID
        sync: false
      - key: KICK_LOG_CHANNEL_ID
        sync: false
      - key: ONBOARDING_CHANNEL_ID
        sync: false
      - key: REFUSED_CV_CHANNEL_ID
        sync: false
      - key: CV_POLICE_CHANNEL_ID
        sync: false
      - key: SYNC_COMMANDS_ON_START
        value: "false"
      - key: STARTUP_DIAGNOSTICS
        value: "false"
      - key: ENABLE_GUILD_MEMBERS_INTENT
        value: "false"
      - key: ENABLE_MESSAGE_CONTENT_INTENT
        value: "false"
      - key: DELETE_EPHEMERAL_REPLIES
        value: "false"
